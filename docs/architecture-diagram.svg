<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d4af37"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#121212"/>

  <text x="560" y="36" text-anchor="middle" fill="#d4af37" font-size="22" font-weight="bold">Jtap — System Architecture</text>
  <text x="560" y="60" text-anchor="middle" fill="#9a9a9a" font-size="13">CSC 325 Module 4 · adapted to the Jtap project (real stack)</text>

  <!-- Mobile app -->
  <rect x="30" y="90" width="270" height="400" rx="12" fill="#1e1e1e" stroke="#d4af37" stroke-width="2"/>
  <text x="165" y="120" text-anchor="middle" fill="#d4af37" font-size="16" font-weight="bold">Jtap Mobile App</text>
  <text x="165" y="140" text-anchor="middle" fill="#9a9a9a" font-size="11">Expo · React Native · Expo Router</text>
  <g font-size="12" fill="#f5f5f5">
    <rect x="50" y="160" width="230" height="56" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="165" y="184" text-anchor="middle">Map — nearby rigs · drop tutorial</text>
    <rect x="50" y="226" width="230" height="56" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="165" y="250" text-anchor="middle">Browse — global rig search</text>
    <rect x="50" y="292" width="230" height="56" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="165" y="316" text-anchor="middle">Chat — global &amp; local threads</text>
    <rect x="50" y="358" width="230" height="56" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="165" y="382" text-anchor="middle">Ducks — pond · drops · trades</text>
    <rect x="50" y="424" width="230" height="56" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="165" y="448" text-anchor="middle">Profile — rig · photos · milestones</text>
  </g>
  <text x="165" y="478" text-anchor="middle" fill="#9a9a9a" font-size="10">API client layer · AsyncStorage cache</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="290" x2="396" y2="290" stroke="#d4af37" stroke-width="2" marker-end="url(#arr)"/>
  <text x="348" y="276" text-anchor="middle" fill="#d4af37" font-size="11">HTTPS · REST/JSON · JWT</text>

  <!-- ngrok -->
  <rect x="400" y="240" width="170" height="100" rx="10" fill="#1e1e1e" stroke="#d4af37" stroke-width="2"/>
  <text x="485" y="280" text-anchor="middle" fill="#d4af37" font-size="14" font-weight="bold">ngrok tunnel</text>
  <text x="485" y="300" text-anchor="middle" fill="#9a9a9a" font-size="11">public HTTPS URL</text>
  <text x="485" y="318" text-anchor="middle" fill="#9a9a9a" font-size="11">PC-hosted backend</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="290" x2="646" y2="290" stroke="#d4af37" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Backend -->
  <rect x="650" y="90" width="300" height="400" rx="12" fill="#1e1e1e" stroke="#d4af37" stroke-width="2"/>
  <text x="800" y="120" text-anchor="middle" fill="#d4af37" font-size="16" font-weight="bold">FastAPI Backend · Uvicorn</text>
  <text x="800" y="140" text-anchor="middle" fill="#9a9a9a" font-size="11">Python · layered monolith</text>
  <g font-size="12">
    <rect x="670" y="160" width="260" height="66" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="800" y="186" text-anchor="middle" fill="#f5f5f5" font-weight="bold">Route handlers</text>
    <text x="800" y="206" text-anchor="middle" fill="#9a9a9a" font-size="10">/users · /chat · /ducks · /drops · /trades</text>
    <rect x="670" y="238" width="260" height="66" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="800" y="264" text-anchor="middle" fill="#f5f5f5" font-weight="bold">Auth service</text>
    <text x="800" y="284" text-anchor="middle" fill="#9a9a9a" font-size="10">JWT bearer · bcrypt passwords</text>
    <rect x="670" y="316" width="260" height="66" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="800" y="342" text-anchor="middle" fill="#f5f5f5" font-weight="bold">Domain logic</text>
    <text x="800" y="362" text-anchor="middle" fill="#9a9a9a" font-size="10">Haversine proximity · drop claims · trades</text>
    <rect x="670" y="394" width="260" height="66" rx="8" fill="#2c2c2e" stroke="#d4af37" stroke-width="1"/>
    <text x="800" y="420" text-anchor="middle" fill="#f5f5f5" font-weight="bold">SQLAlchemy ORM</text>
    <text x="800" y="440" text-anchor="middle" fill="#9a9a9a" font-size="10">models · schemas · sessions</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="800" y1="490" x2="800" y2="526" stroke="#d4af37" stroke-width="2" marker-end="url(#arr)"/>
  <text x="818" y="514" fill="#d4af37" font-size="11">SQL</text>

  <!-- SQLite -->
  <rect x="650" y="530" width="300" height="90" rx="10" fill="#1e1e1e" stroke="#d4af37" stroke-width="2"/>
  <text x="800" y="562" text-anchor="middle" fill="#d4af37" font-size="14" font-weight="bold">SQLite database</text>
  <text x="800" y="582" text-anchor="middle" fill="#9a9a9a" font-size="11">single file · Docker persistent volume</text>
  <text x="800" y="600" text-anchor="middle" fill="#9a9a9a" font-size="11">users · ducks · drops · chat · reactions</text>

  <!-- External services -->
  <rect x="30" y="530" width="540" height="100" rx="10" fill="#1e1e1e" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="300" y="556" text-anchor="middle" fill="#9a9a9a" font-size="12" font-weight="bold">External services</text>
  <rect x="50" y="568" width="240" height="46" rx="8" fill="#2c2c2e" stroke="#9a9a9a" stroke-width="1"/>
  <text x="170" y="588" text-anchor="middle" fill="#f5f5f5" font-size="11">Google Maps SDK</text>
  <text x="170" y="604" text-anchor="middle" fill="#9a9a9a" font-size="10">map tiles (client)</text>
  <rect x="310" y="568" width="240" height="46" rx="8" fill="#2c2c2e" stroke="#9a9a9a" stroke-width="1"/>
  <text x="430" y="588" text-anchor="middle" fill="#f5f5f5" font-size="11">Open-Meteo REST</text>
  <text x="430" y="604" text-anchor="middle" fill="#9a9a9a" font-size="10">weather widget (server-called)</text>

  <!-- Dashed connectors -->
  <line x1="170" y1="568" x2="170" y2="494" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <polyline points="430,568 430,508 720,508 720,494" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <text x="575" y="500" text-anchor="middle" fill="#9a9a9a" font-size="10">REST</text>

  <!-- Legend -->
  <line x1="30" y1="662" x2="70" y2="662" stroke="#d4af37" stroke-width="2" marker-end="url(#arr)"/>
  <text x="78" y="666" fill="#9a9a9a" font-size="11">request flow</text>
  <line x1="180" y1="662" x2="220" y2="662" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="228" y="666" fill="#9a9a9a" font-size="11">third-party integration</text>
  <text x="420" y="666" fill="#d4af37" font-size="11">Styles: client–server · layered monolith · client-driven polling · third-party services</text>
</svg>

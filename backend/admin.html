<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jtap Database Admin</title>
<style>
  :root { --gold: #d4af37; --bg: #121212; --card: #1e1e1e; --surface: #2c2c2e; --muted: #8e8e93; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { background: #1a1a1a; padding: 20px; border-bottom: 1px solid var(--surface); position: sticky; top: 0; }
  header h1 { margin: 0; color: var(--gold); font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #crumb { color: var(--gold); font-size: 13px; margin-top: 8px; }
  #crumb a { color: var(--gold); cursor: pointer; text-decoration: none; margin-right: 6px; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .card:hover { background: var(--surface); }
  .card .name { flex: 1; font-weight: 700; }
  .card .count { color: var(--gold); font-weight: 700; }
  .kv { display: flex; padding: 8px 0; border-bottom: 1px solid var(--surface); font-size: 14px; }
  .kv .k { color: var(--gold); width: 160px; flex-shrink: 0; font-weight: 600; }
  .kv .v { word-break: break-word; }
  .rowline { display: flex; gap: 10px; align-items: center; }
  .rowline .id { color: var(--gold); font-weight: 700; min-width: 52px; }
  .rowline .sum { color: #ccc; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: var(--gold); color: #121212; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: 14px; }
  button.ghost { background: var(--surface); color: #fff; }
  .toolmenuitem { display:block; width:100%; background:transparent; border:none; color:#fff;
    text-align:left; padding:10px 12px; font-size:14px; border-radius:8px; margin-top:0; }
  .toolmenuitem:hover { background:var(--surface); }
  button.danger { background: transparent; border: 1px solid #5a2a2a; color: #ff5a5a; width: 100%; margin-top: 12px; }
  input { width: 100%; background: var(--surface); border: 1px solid #444; color: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
  textarea { width: 100%; background: var(--surface); border: 1px solid #444; color: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 14px; font-family: inherit; }
  select { width: 100%; background: var(--surface); border: 1px solid #444; color: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
  .login { max-width: 380px; margin: 60px auto; background: var(--card); padding: 24px; border-radius: 12px; }
  .login h2 { color: var(--gold); margin-top: 0; }
  .err { color: #ff8a8a; margin-bottom: 10px; font-size: 14px; }
  .empty { color: var(--muted); }
  #more { width: 100%; margin: 8px 0 24px; }
</style>
</head>
<body>
<header>
  <h1>&#128737; Jtap Database Admin</h1>
  <p id="sub">Sign in with an admin account</p>
  <div id="crumb"></div>
  <div id="aitools" style="display:none; margin-top:10px;">
    <div style="position:relative; display:inline-block;">
      <button id="menubtn" style="width:auto; padding:8px 16px; font-size:14px;" onclick="toggleMenu(event)">☰ <span id="menulabel">Tools</span></button>
      <div id="toolmenu" style="display:none; position:absolute; top:110%; left:0; z-index:50; background:var(--card); border:1px solid #444; border-radius:10px; padding:6px; min-width:220px; box-shadow:0 8px 24px rgba(0,0,0,0.5);"></div>
    </div>
    <div id="toolpanes" style="margin-top:10px;">
    <div id="tool-broadcast" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">📢 Broadcast to global chat</div>
      <input id="b_msg" placeholder="Announcement message…" maxlength="500" style="margin-bottom:8px;">
      <button style="padding:8px 16px; font-size:13px; width:100%;" onclick="broadcast()">Send broadcast</button>
    </div>
    <div id="tool-lookup" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">🔍 Find a user</div>
      <div style="display:flex; gap:8px;">
        <input id="l_email" type="email" placeholder="User email" style="margin-bottom:8px; flex:1;">
        <button style="padding:8px 16px; font-size:13px; margin-bottom:8px;" onclick="lookupUser()">Go</button>
      </div>
    </div>
    <div id="tool-mod" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">🛒 Marketplace moderation</div>
      <button style="padding:8px 16px; font-size:13px; width:100%;" onclick="reviewListings()">Review newest listings</button>
    </div>
    <div id="tool-drop" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">📍 Create duck drop</div>
      <select id="p_duck" style="margin-bottom:8px;"></select>
      <div style="display:flex; gap:8px;">
        <input id="p_lat" type="number" step="any" placeholder="Latitude" style="margin-bottom:8px;">
        <input id="p_lng" type="number" step="any" placeholder="Longitude" style="margin-bottom:8px;">
      </div>
      <div style="display:flex; gap:8px;">
        <input id="p_radius" type="number" value="200" min="50" placeholder="Radius (m)" title="Radius in meters" style="margin-bottom:8px;">
        <input id="p_hours" type="number" value="2" min="0.25" max="72" step="any" placeholder="Hours" title="Duration in hours" style="margin-bottom:8px;">
        <input id="p_claims" type="number" value="5" min="1" max="500" placeholder="Claims" title="Max claims" style="margin-bottom:8px;">
      </div>
      <input id="p_label" placeholder="Label (optional)" style="margin-bottom:8px;">
      <button style="padding:8px 16px; font-size:13px; width:100%;" onclick="createDrop()">Drop it</button>
    </div>
    <div id="tool-give" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">🎁 Give or take ducks</div>
      <input id="g_email" type="email" placeholder="User email" style="margin-bottom:8px;">
      <div style="display:flex; gap:8px;">
        <select id="g_duck" style="flex:1;"></select>
        <input id="g_qty" type="number" value="1" min="-100" max="100" style="width:70px; margin-bottom:8px;" title="Negative removes ducks">
      </div>
      <button style="padding:8px 16px; font-size:13px; width:100%;" onclick="grantDuck()">Give / take ducks</button>
      <button style="padding:8px 16px; font-size:13px; width:100%; margin-top:8px;" onclick="backfillLore()">✨ Backfill duck lore</button>
    </div>
    <div id="tool-create" class="toolcard" style="background:var(--card); border-radius:10px; padding:12px; max-width:480px; display:none;">
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin-bottom:8px;">➕ Create duck type</div>
      <input id="d_name" placeholder="Name (e.g. Trail Boss Duck)" style="margin-bottom:8px;">
      <div style="display:flex; gap:8px;">
        <select id="d_rarity" style="flex:1;">
          <option value="common">common</option>
          <option value="rare">rare</option>
          <option value="epic">epic</option>
          <option value="legendary">legendary</option>
        </select>
        <input id="d_emoji" placeholder="🐤" style="width:70px; margin-bottom:8px;">
      </div>
      <input id="d_desc" placeholder="Short description (optional)" style="margin-bottom:8px;">
      <input id="d_seasonal" placeholder="Seasonal tag, e.g. halloween (optional)" style="margin-bottom:8px;">
      <div style="color:var(--muted); font-size:12px; margin-bottom:6px;">Sprite (optional — overrides emoji)</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="d_theme" style="flex:1;" onchange="fillSpriteOptions()"></select>
        <select id="d_sprite" style="flex:1;" onchange="previewSprite()"></select>
        <img id="d_preview" style="width:48px; height:48px; border-radius:8px; background:var(--surface); display:none;">
      </div>
      <div style="margin-bottom:8px;"></div>
      <button style="padding:8px 16px; font-size:13px; width:100%;" onclick="createDuckType()">Create duck type</button>
    </div>
  </div>
</header>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const crumb = document.getElementById('crumb');
const sub = document.getElementById('sub');
let tables = [], table = null, rows = [], offset = 0, hasMore = false, detailEditable = [];
const PAGE = 50;

const SUMMARY = {
  users: ['email'], duck_types: ['name', 'rarity'],
  user_ducks: ['user_id', 'duck_type_id', 'count'],
  duck_gives: ['giver_id', 'recipient_id', 'duck_type_id'],
  duck_drops: ['label', 'duck_type_id', 'claims_count'],
  drop_claims: ['drop_id', 'user_id'], trades: ['proposer_id', 'recipient_id', 'status'],
  user_milestones: ['user_id', 'key'], photo_reactions: ['photo_owner_id', 'emoji'],
  messages: ['user_id', 'channel', 'message'],
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts = {}) {
  const token = sessionStorage.getItem('jtap_admin_token');
  const res = await fetch(path, { ...opts,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (res.status === 401 || res.status === 403) { showLogin('Not signed in as admin.'); throw new Error('auth'); }
  if (!res.ok) throw new Error(await res.text().catch(() => res.status));
  return res.json();
}

function showLogin(msg) {
  sub.textContent = 'Sign in with an admin account';
  crumb.innerHTML = '';
  app.innerHTML = `<div class="login"><h2>Admin sign in</h2>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go" style="width:100%">Sign in</button></div>`;
  const doLogin = async () => {
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    try {
      const r = await fetch('/login', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }) });
      if (!r.ok) throw new Error('Login failed');
      const data = await r.json();
      sessionStorage.setItem('jtap_admin_token', data.access_token);
      loadTables();
    } catch (e) { showLogin(e.message); }
  };
  document.getElementById('go').onclick = doLogin;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}

const TOOLS = [
  ["tool-broadcast", "📢 Broadcast"],
  ["tool-lookup", "🔍 Find user"],
  ["tool-mod", "🛒 Moderation"],
  ["tool-drop", "📍 Create drop"],
  ["tool-give", "🎁 Give ducks"],
  ["tool-create", "➕ New duck"],
];

function buildToolMenu() {
  const menu = document.getElementById('toolmenu');
  menu.innerHTML = TOOLS.map(([id, label]) =>
    `<button class="toolmenuitem" onclick="showTool('${id}')">${label}</button>`).join('');
}

function toggleMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('toolmenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function showTool(id) {
  document.querySelectorAll('.toolcard').forEach(el => {
    el.style.display = el.id === id ? 'block' : 'none';
  });
  const found = TOOLS.find(t => t[0] === id);
  document.getElementById('menulabel').textContent = found ? found[1] : 'Tools';
  document.getElementById('toolmenu').style.display = 'none';
}

document.addEventListener('click', () => {
  const menu = document.getElementById('toolmenu');
  if (menu && menu.style.display === 'block') menu.style.display = 'none';
});

async function loadTables() {
  try {
    const data = await api('/admin/overview');
    tables = data.tables;
    sub.textContent = 'Browse every table in the app database';
    crumb.innerHTML = '';
    document.getElementById('aitools').style.display = 'block';
    buildToolMenu();
    showTool('tool-broadcast');
    loadDuckOptions();
    loadDuckSprites();
    let statsHtml = '';
    try {
      const s = await api('/admin/stats');
      const card = (label, big, small) =>
        `<div style="background:var(--card); border-radius:10px; padding:12px; flex:1; min-width:140px;">
           <div style="font-size:22px; font-weight:800; color:var(--gold);">${big}</div>
           <div style="font-size:12px; color:var(--muted);">${label}</div>
           ${small ? `<div style="font-size:11px; color:#888; margin-top:4px;">${small}</div>` : ''}
         </div>`;
      statsHtml = `<div style="color:var(--gold); font-weight:700; font-size:13px; margin:4px 0 8px;">📊 App health</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">` +
        card('Users', s.users.total, `${s.users.admins} admin · ${s.users.banned} banned`) +
        card('Ducks in circulation', s.ducks.inventory, `${s.ducks.types} types · ${s.ducks.pond_unlocks} pond unlocks`) +
        card('Active drops', s.drops.active, `${s.drops.total} total · ${s.drops.created_7d} this week`) +
        card('Pending trades', s.trades.pending, `${s.trades.total} total · ${s.trades.created_7d} this week`) +
        card('Active listings', s.marketplace.active, `${s.marketplace.sold} sold · ${s.marketplace.created_7d} this week`) +
        card('Chat messages', s.messages.total, '') +
        `</div>`;
    } catch (e) { /* stats are a bonus; tables still work */ }
    app.innerHTML = statsHtml + tables.map(t =>
      `<div class="card" onclick="openTable('${t.table}')">
         <span class="name">${esc(t.table)}</span><span class="count">${t.count}</span><span>&#8250;</span>
       </div>`).join('');
  } catch (e) { /* showLogin already handled auth */ }
}

async function backfillLore() {
  if (!confirm('Generate AI lore for every duck missing it? Takes a few minutes on CPU.')) return;
  try {
    const data = await api('/admin/duck-types/backfill-lore', { method: 'POST' });
    alert(`Lore generation started for ${data.ducks} duck(s). Check back in a few minutes, then tap a duck in the pond.`);
  } catch (e) { alert('Backfill failed: ' + e.message); }
}

async function loadDuckOptions() {
  try {
    const data = await api('/admin/tables/duck_types?limit=100&offset=0');
    const opts = data.rows.map(r =>
      `<option value="${r.id}">${esc(r.emoji || '🦆')} ${esc(r.name)} (${esc(r.rarity)})</option>`).join('');
    document.getElementById('g_duck').innerHTML = opts;
    const p = document.getElementById('p_duck');
    if (p) p.innerHTML = opts;
  } catch (e) { /* auth handled elsewhere */ }
}

async function broadcast() {
  const message = document.getElementById('b_msg').value.trim();
  if (!message) { alert('Type the announcement first.'); return; }
  if (!confirm(`Post this to global chat?\n\n"${message}"`)) return;
  try {
    await api('/admin/broadcast', { method: 'POST', body: JSON.stringify({ message }) });
    alert('Broadcast sent to global chat.');
    document.getElementById('b_msg').value = '';
  } catch (e) { alert('Broadcast failed: ' + e.message); }
}

async function lookupUser() {
  const email = document.getElementById('l_email').value.trim();
  if (!email) { alert('Enter the user\'s email.'); return; }
  try {
    const data = await api('/admin/users/lookup?email=' + encodeURIComponent(email));
    const u = data.user;
    sub.textContent = `user lookup · ${u.email}`;
    crumb.innerHTML = `<a onclick="loadTables()">tables</a> / user lookup`;
    const duckRows = data.ducks.length ? data.ducks.map(d =>
      `<div class="kv"><span class="k">${esc(d.duck.emoji || '🐤')} ${esc(d.duck.name || '#' + d.duck.id)}</span><span class="v">×${d.count}</span></div>`).join('')
      : '<div style="color:var(--muted); font-size:13px;">No ducks yet.</div>';
    const listingRows = data.listings.length ? data.listings.map(l =>
      `<div class="kv"><span class="k">${esc(l.title)}</span><span class="v">$${esc(l.price)} · ${l.is_sold ? 'sold' : 'active'}</span></div>`).join('')
      : '<div style="color:var(--muted); font-size:13px;">No listings.</div>';
    const tradeRows = data.trades.length ? data.trades.map(t =>
      `<div class="kv"><span class="k">trade #${t.id}</span><span class="v">${esc(t.status)}</span></div>`).join('')
      : '<div style="color:var(--muted); font-size:13px;">No trades.</div>';
    app.innerHTML =
      `<div class="card" style="cursor:default; display:block">
        <div class="kv"><span class="k">email</span><span class="v">${esc(u.email)}</span></div>
        <div class="kv"><span class="k">id</span><span class="v">${u.id}</span></div>
        <div class="kv"><span class="k">admin</span><span class="v">${u.is_admin ? 'yes' : 'no'}</span></div>
        <div class="kv"><span class="k">banned</span><span class="v">${u.is_banned ? 'YES' : 'no'}</span></div>
        <div class="kv"><span class="k">ducks unlocked</span><span class="v">${data.pond_unlocked}</span></div>
        <div class="kv"><span class="k">drops created</span><span class="v">${data.drops_created}</span></div>
        <div class="kv"><span class="k">milestones</span><span class="v">${data.milestones}</span></div>
      </div>
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin:14px 0 6px;">Duck inventory</div>
      <div class="card" style="cursor:default; display:block">${duckRows}</div>
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin:14px 0 6px;">Marketplace listings</div>
      <div class="card" style="cursor:default; display:block">${listingRows}</div>
      <div style="color:var(--gold); font-weight:700; font-size:13px; margin:14px 0 6px;">Trades</div>
      <div class="card" style="cursor:default; display:block">${tradeRows}</div>
      <div style="display:flex; gap:10px;">
        <button class="${u.is_banned ? 'ghost' : 'danger'}" style="flex:1; margin-top:0;" onclick="toggleBan(${u.id}, ${!!u.is_banned}, lookupUser)">${u.is_banned ? 'Unban' : 'Ban'} this user</button>
        <button class="ghost" style="flex:1;" onclick="openTable('users')">Back to users table</button>
      </div>`;
  } catch (e) { alert('Lookup failed: ' + e.message); }
}

async function reviewListings() {
  try {
    const data = await api('/admin/marketplace/queue');
    sub.textContent = 'marketplace moderation · newest first';
    crumb.innerHTML = `<a onclick="loadTables()">tables</a> / moderation`;
    app.innerHTML = data.listings.length ? data.listings.map(l => `
      <div class="card" style="cursor:default; display:block">
        ${l.photo_url ? `<img src="${esc(l.photo_url)}" style="width:100%; border-radius:8px; margin-bottom:8px;">` : ''}
        <div class="kv"><span class="k">title</span><span class="v">${esc(l.title)} — $${esc(l.price)}</span></div>
        <div class="kv"><span class="k">seller</span><span class="v">${esc(l.seller_email || l.seller_name || ('#' + l.user_id))}</span></div>
        <div class="kv"><span class="k">status</span><span class="v">${l.is_sold ? 'sold' : 'active'} · ${esc(l.category || '')}</span></div>
        <div style="color:#ccc; font-size:13px; margin:6px 0;">${esc(l.description || '')}</div>
        <div style="display:flex; gap:10px;">
          <button class="danger" style="flex:1; margin-top:0;" onclick="modDelete(${l.id})">Delete listing</button>
          <button class="ghost" style="flex:1;" onclick="table='market_listings';openDetail(${l.id})">Full record</button>
        </div>
      </div>`).join('')
      : '<div style="color:var(--muted);">No listings yet.</div>';
  } catch (e) { alert('Could not load queue: ' + e.message); }
}

async function modDelete(id) {
  if (!confirm(`Delete listing #${id}? Its photo is removed too. This cannot be undone.`)) return;
  try {
    await api(`/admin/tables/market_listings/${id}`, { method: 'DELETE' });
    reviewListings();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

async function createDrop() {
  const duck_type_id = parseInt(document.getElementById('p_duck').value, 10);
  const latitude = parseFloat(document.getElementById('p_lat').value);
  const longitude = parseFloat(document.getElementById('p_lng').value);
  if (!duck_type_id) { alert('Pick a duck.'); return; }
  if (!isFinite(latitude) || !isFinite(longitude)) { alert('Enter latitude and longitude.'); return; }
  const body = {
    duck_type_id, latitude, longitude,
    radius_m: parseFloat(document.getElementById('p_radius').value) || 200,
    duration_hours: parseFloat(document.getElementById('p_hours').value) || 2,
    max_claims: parseInt(document.getElementById('p_claims').value, 10) || 5,
    label: document.getElementById('p_label').value.trim() || null,
  };
  try {
    const data = await api('/admin/drops', { method: 'POST', body: JSON.stringify(body) });
    alert(`Drop #${data.id} is live! Clue is generating in the background.`);
    document.getElementById('p_label').value = '';
  } catch (e) { alert('Drop failed: ' + e.message); }
}

async function grantDuck() {
  const email = document.getElementById('g_email').value.trim();
  const duck_type_id = parseInt(document.getElementById('g_duck').value, 10);
  const qty = parseInt(document.getElementById('g_qty').value, 10) || 1;
  if (!email) { alert('Enter the user\'s email.'); return; }
  if (!duck_type_id) { alert('Pick a duck.'); return; }
  try {
    const data = await api('/admin/ducks/grant', { method: 'POST',
      body: JSON.stringify({ email, duck_type_id, qty }) });
    alert(qty < 0 ? `Removed ${data.removed}x duck from ${data.email}.` : `Gave ${data.qty}x duck to ${data.email}.`);
    document.getElementById('g_email').value = '';
  } catch (e) { alert('Grant failed: ' + e.message); }
}

let spriteThemes = {};
let spriteUsed = {};

async function loadDuckSprites() {
  try {
    const data = await api('/admin/duck-sprites');
    spriteThemes = data.themes || {};
    spriteUsed = data.used || {};
    const themes = Object.keys(spriteThemes);
    document.getElementById('d_theme').innerHTML =
      `<option value="">No sprite (use emoji)</option>` +
      themes.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    fillSpriteOptions();
  } catch (e) { /* sprites are optional */ }
}

function fillSpriteOptions() {
  const theme = document.getElementById('d_theme').value;
  const sprites = spriteThemes[theme] || [];
  document.getElementById('d_sprite').innerHTML = sprites.map(u => {
    const name = u.split('/').pop().replace('.png', '');
    const taken = spriteUsed[u];
    return `<option value="${esc(u)}"${taken ? ' disabled' : ''}>${esc(name)}${taken ? ` — used by ${esc(taken)}` : ''}</option>`;
  }).join('');
  previewSprite();
}

function previewSprite() {
  const url = document.getElementById('d_sprite').value;
  const img = document.getElementById('d_preview');
  if (url) { img.src = url; img.style.display = 'block'; }
  else { img.style.display = 'none'; }
}

async function createDuckType() {
  const name = document.getElementById('d_name').value.trim();
  if (!name) { alert('Enter a duck name.'); return; }
  const body = {
    name,
    rarity: document.getElementById('d_rarity').value,
    emoji: document.getElementById('d_emoji').value.trim() || '🐤',
    description: document.getElementById('d_desc').value.trim() || null,
    seasonal: document.getElementById('d_seasonal').value.trim() || null,
    image_url: document.getElementById('d_sprite').value || null,
  };
  try {
    const data = await api('/admin/duck-types', { method: 'POST', body: JSON.stringify(body) });
    alert(`Created "${data.name}" (${data.rarity})! Lore is generating in the background.`);
    document.getElementById('d_name').value = '';
    document.getElementById('d_desc').value = '';
    document.getElementById('d_seasonal').value = '';
    loadDuckOptions();
    loadDuckSprites();
  } catch (e) { alert('Create failed: ' + e.message); }
}

async function openTable(name) {
  table = name; offset = 0;
  try {
    const data = await api(`/admin/tables/${name}?limit=${PAGE}&offset=0`);
    rows = data.rows;
    hasMore = data.total === undefined ? rows.length === PAGE : data.total > PAGE;
    renderRows();
  } catch (e) { alert('Could not load table: ' + e.message); }
}

function summarize(r) {
  const fields = SUMMARY[table] || Object.keys(r).filter(k => k !== 'id').slice(0, 2);
  return fields.map(f => r[f]).filter(v => v !== undefined && v !== null && v !== '')
    .map(v => { v = String(v); return v.length > 40 ? v.slice(0, 40) + '…' : v; })
    .slice(0, 2).join(' · ') || '—';
}

function renderRows() {
  sub.textContent = `${rows.length} rows loaded · newest first`;
  crumb.innerHTML = `<a onclick="loadTables()">tables</a> / ${esc(table)}`;
  app.innerHTML = (rows.length ? rows.map(r =>
    `<div class="card" onclick="openDetail(${r.id})">
       <div class="rowline"><span class="id">#${r.id}</span><span class="sum">${esc(summarize(r))}</span><span>&#8250;</span></div>
     </div>`).join('') : '<p class="empty">No rows in this table yet.</p>')
    + (hasMore ? '<button id="more" class="ghost" onclick="loadMore()">Load more</button>' : '');
}

async function loadMore() {
  const next = offset + PAGE;
  try {
    const data = await api(`/admin/tables/${table}?limit=${PAGE}&offset=${next}`);
    rows = rows.concat(data.rows);
    offset = next;
    hasMore = data.total === undefined ? data.rows.length === PAGE : data.total > next + PAGE;
    renderRows();
  } catch (e) { alert('Could not load more: ' + e.message); }
}

async function openDetail(id) {
  try {
    const data = await api(`/admin/tables/${table}/${id}`);
    const row = data.row;
    detailEditable = data.editable || [];
    sub.textContent = `${table} · full record`;
    crumb.innerHTML = `<a onclick="loadTables()">tables</a> / <a onclick="openTable('${table}')">${esc(table)}</a> / #${id}`;
    app.innerHTML = `<div class="card" style="cursor:default; display:block">` +
      Object.entries(row).map(([k, v]) =>
        `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</span></div>`).join('') +
      `</div>
      <div style="display:flex; gap:10px;">
        ${detailEditable.length ? `<button class="ghost" style="flex:1;" onclick="editRow(${id})">Edit</button>` : ''}
        ${table === 'users' ? `<button class="${row.is_banned ? 'ghost' : 'danger'}" style="flex:1; margin-top:0;" onclick="toggleBan(${id}, ${!!row.is_banned}, () => openDetail(${id}))">${row.is_banned ? 'Unban' : 'Ban'} user</button>` : ''}
        <button class="danger" style="flex:1; margin-top:0;" onclick="delRow(${id})">Delete this row</button>
      </div>`;
  } catch (e) { alert('Could not load row: ' + e.message); }
}

async function toggleBan(id, currentlyBanned, refresh) {
  const action = currentlyBanned ? 'unban' : 'ban';
  if (!confirm(`${action === 'ban' ? 'Ban' : 'Unban'} user #${id}?${action === 'ban' ? ' They will be locked out immediately.' : ''}`)) return;
  try {
    await api(`/admin/users/${id}/${action}`, { method: 'POST' });
    refresh();
  } catch (e) { alert('Failed: ' + e.message); }
}

function editInput(col, value) {
  const v = value === null || value === undefined ? '' : value;
  const idAttr = `id="f_${col.name}"`;
  if (col.type === 'boolean') {
    return `<input type="checkbox" ${idAttr} ${v ? 'checked' : ''} style="width:auto; transform:scale(1.4);">`;
  }
  const str = typeof v === 'object' ? JSON.stringify(v) : String(v);
  if (str.length > 80 || col.type === 'json') {
    return `<textarea ${idAttr} rows="3">${esc(str)}</textarea>`;
  }
  return `<input ${idAttr} value="${esc(str).replace(/"/g, '&quot;')}">`;
}

async function editRow(id) {
  try {
    const data = await api(`/admin/tables/${table}/${id}`);
    const row = data.row;
    detailEditable = data.editable || [];
    sub.textContent = `${table} · edit record`;
    crumb.innerHTML = `<a onclick="loadTables()">tables</a> / <a onclick="openTable('${table}')">${esc(table)}</a> / <a onclick="openDetail(${id})">#${id}</a> / edit`;
    app.innerHTML = `<div class="card" style="cursor:default; display:block">` +
      detailEditable.map(col =>
        `<div class="kv"><span class="k">${esc(col.name)}<br><small style="color:var(--muted)">${col.type}</small></span>` +
        `<span class="v">${editInput(col, row[col.name])}</span></div>`).join('') +
      `</div>
      <div style="display:flex; gap:10px;">
        <button style="flex:1;" onclick="saveRow(${id})">Save</button>
        <button class="ghost" style="flex:1;" onclick="openDetail(${id})">Cancel</button>
      </div>`;
  } catch (e) { alert('Could not load row: ' + e.message); }
}

async function saveRow(id) {
  const payload = {};
  for (const col of detailEditable) {
    const el = document.getElementById('f_' + col.name);
    if (!el) continue;
    payload[col.name] = col.type === 'boolean' ? el.checked : el.value;
  }
  try {
    await api(`/admin/tables/${table}/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
    openDetail(id);
  } catch (e) { alert('Save failed: ' + e.message); }
}

async function delRow(id) {
  if (!confirm(`Delete ${table} #${id}? This cannot be undone.`)) return;
  try {
    await api(`/admin/tables/${table}/${id}`, { method: 'DELETE' });
    openTable(table);
  } catch (e) { alert('Delete failed: ' + e.message); }
}

showLogin('');
</script>
</body>
</html>
